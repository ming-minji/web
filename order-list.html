<!DOCTYPE html>
<html lang="ko">
<head>
    
    <script src="./script/head-common.js"></script>
    <script src="./script/header.js"></script>
    
    <!-- swiper js -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
    
    <link rel="stylesheet" href="./style/list.css">
    <script src="./script/orderArray.js"></script>
    <script src="./script/orderControl.js"></script>
    <script src="./script/include.js"></script>
    
    <script src="./script/heart.js"></script>
    <script src="./script/toWon.js"></script>
    <script src="./script/getParam.js"></script>
</head>
<body>
    <div id="include-header"></div>

    <main>

        <!-- 서브 배너 -->
         <div class="sub-banner">
            <div class="common-frame">
                <h1>Sandwich Menu</h1>
            </div>
         </div>

         <!-- 타이틀 -->
          <div class="title">
            <div class="common-frame">
                <h3>SANDIE MENU</h3>
                <p>가장 평범한 하루를 특별하게 만드는 샌디만의 신선한 마법 샌드위치</p>
            </div>
          </div>

        <!-- 옵션 -->
        <div class="option">
            <div class="common-frame">
                <div class="total-view">
                    <span>Total</span>
                    <span id="current-count" class="fwb">8</span>
                </div>
                <div>
                    <select id="view-filter" class="b2">
                        <option value="정렬방식">정렬방식</option>
                        <option value="낮은 가격 순">낮은 가격 순</option>
                        <option value="높은 가격 순">높은 가격 순</option>
                        <option value="신상품">신상품</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- 상품리스트 -->
        <div class="list-wrap">
            <div class="common-frame">
                <ul class="list-grid">
                    <li>
                        <a href="./detail.html">
                            <figure>
                                <img src="./img/sand-grilled.jpg" alt="구워진 빵 사이에 양상추가 아래에 깔려있고 그 위에 그릴에 구운 소세지가 올라간 샌드위치">
                            </figure>
                            <div class="list-option">
                                <span class="btn-heart">
                                    <img src="./img/icon-heart.svg" alt="좋아요버튼 하트아이콘">
                                </span>
                            </div>
                            <h4>Grilled Sausage</h4>    
                            <p class="fwr">그릴에서 노릇하게 구워 육즙이 톡 터지는 소세지, 든든한 에너지가 필요한 당신을 위한 완벽한 선택</p>
                            <div class="price fwb">6,500원</div>
                        </a>
                    </li>
                </ul>
            </div>
        </div>

    </main>

     <!-- 푸터 -->
    <div id="include-footer"></div>
</body>
</html>
