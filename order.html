<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SANDIE</title>
    
    <script src="./script/head-common.js"></script>
    <script src="./script/header.js"></script>
    <script src="./script/include.js"></script>

    <!-- swiper js -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>

    <link rel="stylesheet" href="./style/order.css">
</head>
<body>
    <div id="include-header"></div>

    <main>
        <div class="sub-banner">
            <div class="common-frame">
                <h1>older</h1>
            </div>
        </div>
        <div class="older-wrap">
            <div class="common-frame">
                <h3>주문하기</h3>
                <p>샌디 홈페이지 및 APP에서 쉽고 빠르게 샌드위치 주문하기!</p>
                <div class="older-box">
                    <div class="box">
                        <h1>온라인 주문</h1>
                        <p>간편하게 클릭해서 주문해보세요!</p>
                        <figure>
                            <img src="./img/icon-click.svg" alt="클릭하는 화살표">
                        </figure>
                        <a href="./order-list.html" class="btn">이동하기</a>
                    </div>
                    <div class="box">
                        <h1>단체 주문</h1>
                        <p>15개 이상 주문 시 이용해주세요!</p>
                        <figure>
                            <img src="./img/icon-people.svg" alt="다수의 인원">
                        </figure>
                        <a href="./order-list.html" class="btn">이동하기</a></p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="include-footer"></div>
</body>
</html>
